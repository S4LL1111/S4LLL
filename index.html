<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOIR — Premium Store</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Inter,Arial,sans-serif}.nav{height:72px;border-bottom:1px solid #292929;display:flex;align-items:center;padding:0 5%;gap:24px;position:sticky;top:0;background:#080808f2;z-index:5}.logo{font-size:23px;font-weight:900;letter-spacing:4px}.search{flex:1;max-width:520px}.search input{width:100%;padding:13px 17px;border:1px solid #303030;border-radius:11px;background:#111;color:#fff}.btn{background:#151515;color:#fff;border:1px solid #333;border-radius:10px;padding:11px 15px;cursor:pointer}.hero{padding:65px 7% 35px;background:radial-gradient(circle at 70% 20%,#211b0d,transparent 36%)}.eyebrow{color:#e4b94e;letter-spacing:4px;font-size:11px;font-weight:800}.hero h1{font-size:clamp(45px,7vw,82px);line-height:.94;margin:14px 0}.hero p{color:#999;max-width:650px}.wrap{padding:20px 7% 70px}.cats{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}.cat{background:#111;color:#ddd;border:1px solid #333;border-radius:9px;padding:10px 15px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.card{background:#111;border:1px solid #292929;border-radius:16px;overflow:hidden}.pic{height:230px;display:grid;place-items:center;background:linear-gradient(135deg,#252525,#101010);font-size:60px}.info{padding:16px}.muted{color:#909090;font-size:13px}.price{font-size:19px;font-weight:800;margin:8px 0 14px}.row{display:flex;gap:8px}.row button{flex:1}.gold{border-color:#c99d35;color:#efc45d}.footer{border-top:1px solid #292929;padding:25px 7%;color:#777}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.nav{padding:0 4%;gap:10px}.search{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero,.wrap{padding-left:5%;padding-right:5%}}
</style></head>
<body>
<nav class="nav"><div class="logo" id="logo"></div><div class="search"><input id="q" oninput="render()"></div><button class="btn" id="memberBtn" onclick="alert('Login member akan tersedia pada versi production.')"></button><button class="btn" onclick="cart()"><span id="cartLabel"></span> <span id="count">0</span></button></nav>
<section class="hero"><div class="eyebrow" id="eyebrow"></div><h1><span id="h1a"></span><br><span id="h1b"></span><br><span id="h1c"></span></h1><p id="heroDesc"></p></section>
<main class="wrap"><div class="cats" id="cats"></div><div id="products" class="grid"></div></main>
<footer class="footer" id="footer"></footer>
<script>
const SITEKEY='noirSettings', CATKEY='noirCategories'; const defaultSite={logo:'NOIR',search:'Cari produk...',member:'Profil Member',cart:'🛒',eyebrow:'PREMIUM DIGITAL STORE',h1a:'Simple.',h1b:'Dark.',h1c:'Exceptional.',heroDesc:'Produk pilihan dengan tampilan premium. Member hanya melihat area toko.',footer:'© 2026 NOIR Premium Store'}; let site=Object.assign({},defaultSite,JSON.parse(localStorage[SITEKEY]||'{}')); let categories=JSON.parse(localStorage[CATKEY]||'null')||['Template','Gadget','Aksesoris'];
const defaults=[{id:1,n:'Premium Website Template',c:'Template',p:99000,icon:'◈'},{id:2,n:'Aero Smartwatch',c:'Gadget',p:799000,icon:'⌚'},{id:3,n:'Urban Headphones',c:'Gadget',p:549000,icon:'◉'},{id:4,n:'Leather Wallet',c:'Aksesoris',p:179000,icon:'▰'}];
let products=JSON.parse(localStorage.noirProducts||'null')||defaults,cat='all',count=0;
function applySite(){document.getElementById('logo').textContent=site.logo;document.getElementById('q').placeholder=site.search;document.getElementById('memberBtn').textContent=site.member;document.getElementById('cartLabel').textContent=site.cart;document.getElementById('eyebrow').textContent=site.eyebrow;document.getElementById('h1a').textContent=site.h1a;document.getElementById('h1b').textContent=site.h1b;document.getElementById('h1c').textContent=site.h1c;document.getElementById('heroDesc').textContent=site.heroDesc;document.getElementById('footer').textContent=site.footer;document.getElementById('cats').innerHTML='<button class="cat" onclick="setCat(\'all\')">Semua</button>'+categories.map(c=>'<button class="cat" onclick="setCat(\''+c.replace(/'/g,"\\'")+ '\')">'+c+'</button>').join('')}
const rupiah=x=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(x);
function render(){let q=document.getElementById('q').value.toLowerCase();let list=products.filter(x=>(cat==='all'||x.c===cat)&&(x.n.toLowerCase().includes(q)||x.c.toLowerCase().includes(q))&&(x.status||'Aktif')==='Aktif');document.getElementById('products').innerHTML=list.map(x=>`<article class="card"><div class="pic">${x.image?`<img src="${x.image}" style="width:100%;height:100%;object-fit:cover">`:x.icon||'◈'}</div><div class="info"><div class="muted">${x.c}</div><h3>${x.n}</h3><div class="price">${rupiah(x.p)}</div><div class="row"><button class="btn gold" onclick="buy('${x.n.replace(/'/g,"\\'")}')">Beli</button><button class="btn" onclick="add()">+ Keranjang</button></div></div></article>`).join('')||'<p class="muted">Produk tidak ditemukan.</p>'}
function setCat(x){cat=x;render()} function add(){count++;document.getElementById('count').textContent=count} function cart(){alert('Keranjang: '+count+' item.')} function buy(n){alert('Checkout demo: '+n+'\\nPembayaran production harus diverifikasi server sebelum produk digital dikirim.')} applySite(); render();
</script></body></html>
