<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA FORSELL S4LL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Inter,Arial,sans-serif}a{text-decoration:none;color:inherit}
.nav{height:76px;border-bottom:1px solid #262626;display:flex;align-items:center;padding:0 6%;gap:28px;position:sticky;top:0;background:#080808ee;backdrop-filter:blur(12px);z-index:5}.logo{font-size:22px;font-weight:900;letter-spacing:4px}.logo span{color:#d9ad42}.search{flex:1;max-width:520px;margin:auto}.search input{width:100%;padding:14px 18px;border:1px solid #303030;border-radius:12px;background:#111;color:#fff;outline:none}.actions{display:flex;gap:10px}.btn{border:1px solid #333;background:#151515;color:#fff;border-radius:11px;padding:12px 16px;cursor:pointer}.btn:hover{border-color:#d9ad42}.gold{border-color:#c79a32;color:#f3c85a}
.hero{padding:70px 7% 35px;background:radial-gradient(circle at 70% 20%,#211b0d,transparent 35%)}.eyebrow{color:#e6b94e;letter-spacing:4px;font-weight:800;font-size:12px}.hero h1{font-size:clamp(48px,8vw,94px);line-height:.92;margin:16px 0}.hero p{color:#a7a7a7;max-width:650px}.wrap{padding:20px 7% 70px}.cats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}.cat{padding:10px 16px;border:1px solid #303030;border-radius:10px;background:#111;color:#ddd;cursor:pointer}.cat.active,.cat:hover{border-color:#d9ad42;color:#f3c85a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#111;border:1px solid #292929;border-radius:18px;overflow:hidden}.pic{height:240px;background:linear-gradient(135deg,#292929,#111);display:flex;align-items:center;justify-content:center;font-size:58px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:18px}.muted{color:#8f8f8f;font-size:13px}.price{font-size:20px;font-weight:800;margin:8px 0 15px}.row{display:flex;gap:8px}.row .btn{flex:1}.empty{grid-column:1/-1;padding:35px;text-align:center;border:1px dashed #303030;border-radius:16px;color:#888}.footer{border-top:1px solid #252525;padding:30px 7%;color:#777;font-size:13px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:12px;z-index:30}.backdrop.show{display:flex}.modal{width:min(700px,96vw);max-height:92vh;background:#111;border:1px solid #343434;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}.modal-head{padding:18px 22px;border-bottom:1px solid #252525;display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.modal-body{padding:20px 22px;overflow-y:auto;min-height:0}.modal-foot{padding:14px 22px;border-top:1px solid #252525;display:flex;justify-content:flex-end;gap:8px}.close{background:none;border:0;color:#fff;font-size:25px;cursor:pointer}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}.field label{font-size:13px;color:#aaa}.field input,.field textarea{width:100%;background:#0a0a0a;border:1px solid #303030;color:#fff;border-radius:10px;padding:12px}.field textarea{min-height:100px;resize:vertical}.notice{padding:12px 14px;border:1px solid #282828;background:#0c0c0c;border-radius:10px;color:#aaa;margin-top:10px}.cart-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #252525}.profile-box{display:grid;gap:10px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.nav{padding:0 4%;gap:12px}.search{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{padding:45px 5% 20px}.wrap{padding:20px 5%}.logo{font-size:17px}.actions .profile-btn{display:none}}
</style></head><body>
<nav class="nav"><div class="logo">GTA <span>FORSELL S4LL</span></div><div class="search"><input id="searchInput" placeholder="Cari produk..." oninput="search(this.value)"></div><div class="actions"><button class="btn profile-btn" onclick="openProfile()">Profil Member</button><button class="btn" onclick="openCart()">🛒 <span id="count">0</span></button></div></nav>
<section class="hero"><div class="eyebrow">GTA FORSELL S4LL</div><h1 id="heroTitle">Simple.<br>Dark.<br>Exceptional.</h1><p id="heroDesc">Premium digital products untuk kebutuhan kamu.</p></section>
<main class="wrap"><div class="cats" id="cats"><button class="cat active" onclick="filter('all',this)">Semua</button></div><div class="grid" id="products"></div></main>
<footer class="footer">© 2026 <span id="footerName">GTA FORSELL S4LL</span> · Admin dikelola melalui ADMIN KING S4LL.</footer>
<div id="modal" class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Keranjang</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Tutup</button></div></div></div>
<script>
const KEY_PRODUCTS='s4ll_products',KEY_APPEAR='s4ll_appearance',KEY_MEMBERS='s4ll_members',KEY_ORDERS='s4ll_orders';
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let products=[],shown=[],cartItems=JSON.parse(localStorage.getItem('s4ll_cart')||'[]');
function loadAppearance(){const a=get(KEY_APPEAR,{siteName:'GTA FORSELL S4LL',profileText:'Profil',heroTitle:'Simple. Dark. Exceptional.',heroDesc:'Premium digital products untuk kebutuhan kamu.',searchText:'Cari produk...',accent:'#d9a52d'});document.title=a.siteName||'GTA FORSELL S4LL';document.querySelector('.logo').innerHTML=esc(a.siteName||'GTA FORSELL S4LL');document.getElementById('heroTitle').innerHTML=esc(a.heroTitle||'Simple. Dark. Exceptional.').replace(/\n/g,'<br>');document.getElementById('heroDesc').textContent=a.heroDesc||'';document.getElementById('searchInput').placeholder=a.searchText||'Cari produk...';document.getElementById('footerName').textContent=a.siteName||'GTA FORSELL S4LL';if(a.accent)document.documentElement.style.setProperty('--accent',a.accent)}
function loadProducts(){products=get(KEY_PRODUCTS,[]).filter(p=>(p.status||'Aktif')==='Aktif');if(!products.length){products=[{id:'demo1',name:'Belum ada produk',category:'GTA FORSELL',price:0,icon:'▣',description:'Tambahkan produk melalui ADMIN KING S4LL.'}]}shown=[...products];buildCats();render()}
function buildCats(){const cats=[...new Set(products.map(p=>p.category).filter(Boolean))];document.getElementById('cats').innerHTML='<button class="cat active" onclick="filter(\'all\',this)">Semua</button>'+cats.map(c=>`<button class="cat" onclick="filter('${esc(c)}',this)">${esc(c)}</button>`).join('')}
function render(){const el=document.getElementById('products');if(!shown.length){el.innerHTML='<div class="empty">Produk tidak ditemukan.</div>';return}el.innerHTML=shown.map(x=>`<article class="card"><div class="pic">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:(x.icon||'▣')}</div><div class="info"><div class="muted">${esc(x.category||'-')}</div><h3>${esc(x.name)}</h3><div class="price">${money(x.price)}</div><div class="row"><button class="btn" onclick="buy('${esc(x.id)}')">Beli</button><button class="btn gold" onclick="add('${esc(x.id)}')">+ Keranjang</button></div></div></article>`).join('')}
function filter(c,btn){shown=c==='all'?[...products]:products.filter(x=>x.category===c);document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');render()}
function search(q){q=q.toLowerCase();shown=products.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.category||'').toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q));document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));render()}
function syncCart(){localStorage.setItem('s4ll_cart',JSON.stringify(cartItems));document.getElementById('count').textContent=cartItems.length}
function add(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;cartItems.push({id:p.id,name:p.name,price:p.price});syncCart();alert('Produk ditambahkan ke keranjang.')}
function openCart(){document.getElementById('modalTitle').textContent='Keranjang';const body=document.getElementById('modalBody');if(!cartItems.length){body.innerHTML='<div class="notice">Keranjang masih kosong.</div>';showModal();return}const total=cartItems.reduce((s,x)=>s+Number(x.price||0),0);body.innerHTML=cartItems.map((x,i)=>`<div class="cart-item"><div><b>${esc(x.name)}</b><div class="muted">${money(x.price)}</div></div><button class="btn" onclick="removeCart(${i})">Hapus</button></div>`).join('')+`<div style="margin-top:16px"><b>Total: ${money(total)}</b></div><button class="btn gold" style="width:100%;margin-top:14px" onclick="checkoutCart()">Checkout</button>`;showModal()}
function removeCart(i){cartItems.splice(i,1);syncCart();openCart()}
function buy(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;cartItems.push({id:p.id,name:p.name,price:p.price});syncCart();openCart()}
function checkoutCart(){if(!cartItems.length)return;const email=prompt('Masukkan email untuk pesanan:');if(!email)return;const orders=get(KEY_ORDERS,[]);const total=cartItems.reduce((s,x)=>s+Number(x.price||0),0);orders.unshift({id:Date.now().toString(36),product:cartItems.map(x=>x.name).join(', '),email,amount:total,total,status:'Diproses',createdAt:new Date().toISOString()});set(KEY_ORDERS,orders);cartItems=[];syncCart();closeModal();alert('Pesanan demo berhasil dicatat.');}
function openProfile(){const email=prompt('Email member:');if(!email)return;const members=get(KEY_MEMBERS,[]);let m=members.find(x=>x.email===email);if(!m){m={id:Date.now().toString(36),name:email.split('@')[0],email};members.push(m);set(KEY_MEMBERS,members)}document.getElementById('modalTitle').textContent='Profil Member';document.getElementById('modalBody').innerHTML=`<div class="profile-box"><b>${esc(m.name)}</b><span class="muted">${esc(m.email)}</span><div class="notice">Member tersimpan dan dapat dilihat dari ADMIN KING S4LL.</div></div>`;showModal()}
function showModal(){document.getElementById('modal').classList.add('show')};function closeModal(){document.getElementById('modal').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('storage',()=>{loadAppearance();loadProducts()});loadAppearance();loadProducts();syncCart();
</script></body></html>
